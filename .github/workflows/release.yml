name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install -g npm@latest
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
          publish: npx changeset publish
          commit: 'chore: versiona pacotes'
          title: 'chore: versiona pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # A tag criada pelo `changeset publish` não chegava ao repositório: as
      # v0.1.1, v0.1.2 e v0.1.3 tiveram de ser criadas à mão. Aqui ela é
      # enviada explicitamente, e só quando houve publicação de fato.
      - name: Envia a tag da versão publicada
        if: steps.changesets.outputs.published == 'true'
        run: |
          set -euo pipefail
          tag="v$(node -p "require('./package.json').version")"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag já existe localmente (criada pelo changesets)."
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" -m "$tag"
          fi
          git push origin "refs/tags/$tag"
          echo "Tag $tag enviada."
