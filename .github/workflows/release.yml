name: Release

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install -g npm@latest
      - uses: changesets/action@v1
        id: changesets
        with:
          version: npm run version
          publish: npx changeset publish
          commit: 'chore: versiona pacotes'
          title: 'chore: versiona pacotes'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'

      # A tag criada pelo `changeset publish` não chega ao repositório: as
      # v0.1.1 a v0.1.4 tiveram de ser criadas à mão. Este passo a envia.
      #
      # Não usa `steps.changesets.outputs.published`: na publicação da 0.1.4 a
      # action publicou com sucesso e ainda assim esse output não veio como
      # 'true', o que fez o passo ser pulado. Em vez disso, compara o estado
      # real — a versão do package.json contra as tags do remoto e o npm — o
      # que também torna o passo idempotente e seguro de reexecutar.
      - name: Envia a tag da versão publicada
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          tag="v$version"

          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag já existe no remoto; nada a fazer."
            exit 0
          fi

          if ! npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version ainda não está no npm; a tag sai na execução que publicar."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$tag" -m "$tag"
          git push origin "refs/tags/$tag"
          echo "Tag $tag enviada."
